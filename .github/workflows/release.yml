# Release: on a tag v*, build both static binaries with the web UI inside, run the smoke
# test, and make a GitHub release with the binaries, SHA256SUMS, the unit and the scripts.
#
# The release job runs only when all gates pass: the tag commit is on main, the tests and
# cargo-deny pass (the same checks as the CI jobs test and deny), the x86_64 smoke test
# passes, and the aarch64 binary runs on a native arm64 runner (--version, check-config, smoke test).
#
# Actions are pinned by full commit SHA (the tag is in the comment). The release job is the
# only job that can write to the repository. Release builds use no cache.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: "1.4.4"
  ZIG_VERSION: "0.17.1"
  CARGO_ZIGBUILD_VERSION: "0.24.1"
  CARGO_DENY_VERSION: "0.21.0"

jobs:
  # A tag on a commit that is not on main (for example on a branch that was not reviewed)
  # gives no release.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main" >&2
            exit 1
          fi

  # The checks of the CI jobs fmt, clippy, test and web, on the tag commit. No cache.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: "1024"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Web UI checks and tests
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - run: cargo deny check
      - run: cargo deny --manifest-path fuzz/Cargo.toml check

  build:
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The system Python on ubuntu-latest refuses pip installs (PEP 668), so use setup-python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild
        run: |
          python -m pip install "ziglang==$ZIG_VERSION"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
      # The script builds the web UI (bun), builds the binary (cargo zigbuild), checks that it
      # is static and holds the built UI, and copies it to out/rusthole-<arch>-linux-musl.
      - name: Build
        env:
          RUSTHOLE_COMMIT: ${{ github.sha }}
          RELEASE_OUT_DIR: ${{ github.workspace }}/out
        run: bash scripts/release-build.sh "${{ matrix.target }}"
      - name: The version is the tag
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          text="$(out/rusthole-x86_64-linux-musl --version)"
          echo "$text"
          version="$(echo "$text" | awk '{print $2}')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the binary has version $version, but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rusthole-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rusthole-x86_64-unknown-linux-musl
          path: out
      - name: Install dig
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)
      - name: Smoke test
        run: |
          chmod +x out/rusthole-x86_64-linux-musl
          bash scripts/smoke-test.sh out/rusthole-x86_64-linux-musl

  # The aarch64 binary on a native arm64 runner (free for public repos): --version,
  # check-config of the packaged config, and the smoke test (scripts/aarch64-check.sh).
  smoke-aarch64:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rusthole-aarch64-unknown-linux-musl
          path: out
      - name: Install dig
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Run the aarch64 binary
        run: bash scripts/aarch64-check.sh out/rusthole-aarch64-linux-musl

  release:
    needs: [on-main, test, deny, build, smoke, smoke-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rusthole-*
          path: dist
          merge-multiple: true
      - name: Add the unit, the scripts and the default config; make SHA256SUMS
        run: |
          cp packaging/install.sh packaging/uninstall.sh packaging/rusthole.service \
            packaging/rusthole.toml dist/
          chmod 0755 dist/rusthole-*-linux-musl dist/install.sh dist/uninstall.sh
          cd dist
          sha256sum rusthole-x86_64-linux-musl rusthole-aarch64-linux-musl \
            install.sh uninstall.sh rusthole.service rusthole.toml > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "rusthole $GITHUB_REF_NAME" \
            --notes "Static binaries for x86_64 and aarch64 Linux, with the web UI inside. See docs/INSTALL.md: verify SHA256SUMS, then run install.sh." \
            dist/rusthole-x86_64-linux-musl dist/rusthole-aarch64-linux-musl \
            dist/install.sh dist/uninstall.sh dist/rusthole.service dist/rusthole.toml \
            dist/SHA256SUMS
