testkit = []

[dependencies]
rusqlite = { workspace = true }
rusthole-core = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[example]]
name = "write_fixture"
required-features = ["testkit"]

[lints]
workspace = true
