name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check

  # Web UI: bun installs the packages and runs the scripts (check, unit tests, build).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: "1024"

  # rusthole-core is pure: no async runtime, no sockets, no HTTP client (amendment A8).
  core-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: rusthole-core has no I/O dependency
        run: |
          tree="$(cargo tree -p rusthole-core -e normal --locked --prefix none)"
          echo "$tree"
          if echo "$tree" | grep -E '^(tokio|mio|socket2|reqwest) ' ; then
            echo "rusthole-core must not depend on tokio, mio, socket2 or reqwest" >&2
            exit 1
          fi

  # Prove the static musl build on each part (amendment A2).
  musl:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The system Python on ubuntu-latest refuses pip installs (PEP 668), so use setup-python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild
        run: |
          python -m pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p rusthole
      - name: Check that the binary is static
        run: |
          bin=target/${{ matrix.target }}/release/rusthole
          info="$(file "$bin")"
          echo "$info"
          ls -l "$bin"
          echo "$info" | grep -Eq 'statically linked|static-pie linked'
          if echo "$info" | grep -q 'dynamically linked'; then
            echo "the binary is not static" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rusthole-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rusthole
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Check the fuzz lock file too
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml

  fuzz:
    runs-on: ubuntu-latest
    env:
      # A pinned nightly (the one that ran the fuzz targets locally): a new nightly must not
      # break CI by surprise.
      FUZZ_NIGHTLY: nightly-2026-11-17
      # Nightly gives new warnings; they must not fail the fuzz job (amendment A8).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      # The pinned stable toolchain builds the seed tool below.
      - run: rustup show
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Restore the fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # fuzz/corpus is not in git. Without valid seeds, random bytes almost never make a zip
      # with a valid gravity.db, so the fuzzer would not reach the SQLite reader or the mapping.
      - name: Write the fuzz seeds
        run: |
          cargo run --locked -p rusthole-import --features testkit --example write_fixture -- --seeds fuzz/corpus
          ls -lR fuzz/corpus | head -20
      - run: cargo "+$FUZZ_NIGHTLY" install cargo-fuzz --locked
      - name: Run each fuzz target for 60 s
        working-directory: fuzz
        run: |
          for t in $(cargo "+$FUZZ_NIGHTLY" fuzz list); do
            cargo "+$FUZZ_NIGHTLY" fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done
