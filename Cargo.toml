[workspace]
resolver = "3"
members = [
    "crates/rusthole-core",
    "crates/rusthole-import",
    "crates/rusthole-dns",
    "crates/rusthole-store",
    "crates/rusthole-web",
    "crates/rusthole-tls",
    "crates/rusthole",
]
default-members = ["crates/rusthole"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/warchant/rusthole"
publish = false

[workspace.dependencies]
# Our crates. Add each one here when another crate first uses it.
rusthole-core = { path = "crates/rusthole-core" }
rusthole-import = { path = "crates/rusthole-import" }
rusthole-tls = { path = "crates/rusthole-tls" }

# Third-party crates. Add new ones here, then use `x = { workspace = true }` in a member.
anyhow = "1"
# Lock-free swap of the current TLS certificate (no lock, so no wait without a time limit).
arc-swap = "1.9"
clap = { version = "4", features = ["derive", "env"] }
idna = "1.1"
# Pure-Rust deflate only. The default features pull in C and crypto crates.
zip = { version = "9.6", default-features = false, features = ["deflate"] }
regex = "1.13"
# TLS (amendment A1): the crypto provider is `ring`. The default features pull in aws-lc,
# so each TLS crate turns them off.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.16", features = ["std"] }
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.54", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
# `bundled` builds SQLite from source, so the static musl build needs no system library.
# `serialize` lets the import read a database from memory, with no temp file.
# `limits` and `hooks` let the import cap value sizes and VM steps for an untrusted file.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "serialize", "limits", "hooks"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3.27"
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Dev
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort): a panic in one task must not stop DNS for everyone.
panic = "unwind"

# Dev and test builds: line tables only for our crates (backtraces keep file and line),
# no debug info for dependencies. Builds are faster and use less disk. Owner decision:
# do not remove. The test profile inherits these settings from dev.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
