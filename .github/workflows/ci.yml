name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check

  # Web UI: bun installs the packages and runs the scripts (check, unit tests, build).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: "1024"

  # rusthole-core is pure: no async runtime, no sockets, no HTTP client (amendment A8).
  core-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: rusthole-core has no I/O dependency
        run: |
          tree="$(cargo tree -p rusthole-core -e normal --locked --prefix none)"
          echo "$tree"
          if echo "$tree" | grep -E '^(tokio|mio|socket2|reqwest) ' ; then
            echo "rusthole-core must not depend on tokio, mio, socket2 or reqwest" >&2
            exit 1
          fi

  # Prove the static musl build on each part (amendment A2). The binary holds the built web
  # UI from the web job (part P8), so the smoke job tests the real UI.
  musl:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The system Python on ubuntu-latest refuses pip installs (PEP 668), so use setup-python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild
        run: |
          python -m pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p rusthole
      - name: Check that the binary is static
        run: |
          bin=target/${{ matrix.target }}/release/rusthole
          info="$(file "$bin")"
          echo "$info"
          ls -l "$bin"
          echo "$info" | grep -Eq 'statically linked|static-pie linked'
          if echo "$info" | grep -q 'dynamically linked'; then
            echo "the binary is not static" >&2
            exit 1
          fi
      - name: Check that the binary holds the built web UI
        run: |
          marker="$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' web/dist/index.html | head -n 1)"
          echo "UI marker: $marker"
          test -n "$marker"
          grep -aqF "$marker" target/${{ matrix.target }}/release/rusthole
      - uses: actions/upload-artifact@v4
        with:
          name: rusthole-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rusthole
          if-no-files-found: error

  # End-to-end test of the x86_64 binary (part P8): plain DNS, blocking, a local record,
  # login and statistics, DoH, the UI, and a clean stop on SIGTERM. scripts/smoke-test.sh
  # lists the checks.
  smoke:
    needs: musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rusthole-x86_64-unknown-linux-musl
          path: out
      - name: Install dig
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)
      - name: Smoke test
        run: |
          chmod +x out/rusthole
          bash scripts/smoke-test.sh out/rusthole
      - name: shellcheck of the scripts
        run: |
          shellcheck packaging/install.sh packaging/uninstall.sh scripts/*.sh
      # DESTDIR mode with a fake binary: no real host change, the config check before the
      # binary replace, the symbolic link refusal and the passwd hint.
      - name: Install script tests
        run: bash scripts/install-test.sh

  # The aarch64 binary (Raspberry Pi) on a native arm64 runner (free for public repos):
  # --version, check-config of the packaged config, and the smoke test
  # (scripts/aarch64-check.sh). No qemu is necessary.
  smoke-aarch64:
    needs: musl
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rusthole-aarch64-unknown-linux-musl
          path: out
      - name: Install dig
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Run the aarch64 binary
        run: bash scripts/aarch64-check.sh out/rusthole

  # The install script and the hardened systemd unit on a real Ubuntu host (part P8). The
  # runner has root and systemd; a development machine often has neither.
  install:
    needs: musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rusthole-x86_64-unknown-linux-musl
          path: out
      - name: Install dig
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)
      - name: Install (two times, to prove that the script is idempotent)
        run: |
          sudo sh packaging/install.sh --binary out/rusthole
          sudo sh packaging/install.sh --binary out/rusthole
          systemctl is-active rusthole.service
          systemd-analyze verify /etc/systemd/system/rusthole.service
          test "$(sudo stat -c '%U %a' /etc/rusthole)" = "rusthole 750"
          test "$(sudo stat -c '%U %a' /var/lib/rusthole)" = "rusthole 750"
          test "$(sudo stat -c '%U %a' /etc/rusthole/rusthole.toml)" = "rusthole 600"
      - name: The service answers and the sandbox allows its work
        run: |
          addr="$(hostname -I | awk '{print $1}')"
          dig +time=3 +tries=3 @"$addr" example.com A | tee dig.txt
          grep -q 'status: NOERROR' dig.txt
          code="$(curl -sk -o /dev/null -w '%{http_code}' "https://$addr:8443/api/v1/stats/summary")"
          test "$code" = "401"
          # The admin password through the config directory (atomic write in /etc/rusthole).
          printf '%s\n%s\n' ci-password-1234 ci-password-1234 |
            sudo -u rusthole /usr/local/bin/rusthole passwd -c /etc/rusthole/rusthole.toml
          sudo grep -q 'password_hash = "\$argon2id' /etc/rusthole/rusthole.toml
          sudo systemctl restart rusthole.service
          systemctl is-active rusthole.service
          sudo journalctl -u rusthole.service --no-pager -o cat | tail -n 40
          if sudo journalctl -u rusthole.service --no-pager -o cat | grep -E ' ERROR |Permission denied|Operation not permitted'; then
            echo "the service log has errors" >&2
            exit 1
          fi
      - name: systemd-analyze security
        run: systemd-analyze security --no-pager rusthole.service
      - name: Uninstall
        run: |
          sudo sh packaging/uninstall.sh
          test ! -e /usr/local/bin/rusthole
          # /etc/rusthole is 0750 and owned by rusthole: the runner user cannot enter it.
          sudo test -e /etc/rusthole/rusthole.toml
          sudo sh packaging/uninstall.sh --purge
          test ! -e /etc/rusthole
          test ! -e /var/lib/rusthole
          if getent passwd rusthole; then exit 1; fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Check the fuzz lock file too
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml

  # A short fuzz run on each push and PR: build all targets, then run each for 10 s, 4 at a
  # time, on the committed seeds and on the stored corpus. It finds a broken target and
  # replays the known inputs. The long run is the nightly job (fuzz-nightly.yml).
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A pinned nightly (the one that ran the fuzz targets locally): a new nightly must not
      # break CI by surprise. fuzz-nightly.yml and scripts/linux.sh read this line.
      FUZZ_NIGHTLY: nightly-2026-11-17
      # Nightly gives new warnings; they must not fail the fuzz job (amendment A8).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      # The pinned stable toolchain builds the seed tool below.
      - run: rustup show
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      # The nightly job stores the minimized corpus on the branch "fuzz-corpus" (one folder
      # for each target). This job only reads it.
      - name: Get the stored fuzz corpus
        run: |
          mkdir -p fuzz/corpus
          if git ls-remote --exit-code --heads origin fuzz-corpus >/dev/null; then
            git fetch --depth=1 origin fuzz-corpus
            git archive FETCH_HEAD | tar -x -C fuzz/corpus
          else
            echo "no branch fuzz-corpus yet: only the seeds"
          fi
          find fuzz/corpus -type f | wc -l
      # The committed seeds are in fuzz/seeds/<target> (scripts/make-fuzz-seeds.py writes
      # them); scripts/fuzz.sh gives them to each run. Random bytes almost never make a zip
      # with a valid gravity.db, so the Teleporter, pihole.toml and config seeds come from the
      # synthetic fixture of rusthole-import.
      - name: Write the fixture seeds
        run: cargo run --locked -p rusthole-import --features testkit --example write_fixture -- --seeds fuzz/corpus
      # A prebuilt cargo-fuzz: a build from source takes minutes.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Test the target list gate of scripts/fuzz.sh
        run: bash scripts/fuzz-gate-test.sh
      # scripts/fuzz.sh fails when `cargo fuzz list` fails or does not list each target of
      # fuzz/Cargo.toml. It builds all targets once, runs 4 at the same time (the runner has
      # 4 CPUs and 16 GB; each run has -rss_limit_mb=2048), and fails when one or more failed.
      - name: Run each fuzz target for 10 s
        env:
          FUZZ_TOOLCHAIN: ${{ env.FUZZ_NIGHTLY }}
          FUZZ_JOBS: 4
        run: bash scripts/fuzz.sh all 10
      # libFuzzer writes the input of a crash, a leak or a timeout to fuzz/artifacts/<target>.
      # Reproduce: cargo +nightly fuzz run <target> <file>.
      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: warn
