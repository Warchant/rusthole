# cargo-deny config. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
]
# libFuzzer (from LLVM) is under NCSA. It is only in the fuzz targets, never in the rusthole
# binary. `cargo deny --manifest-path fuzz/Cargo.toml check` needs this exception.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own crates have no version. They are not published.
allow-wildcard-paths = true
# OpenSSL is not allowed: TLS uses rustls, so the static musl build needs no system libraries.
# aws-lc is not allowed: the TLS crypto provider is `ring` (amendment A1).
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
