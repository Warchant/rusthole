[workspace]
resolver = "3"
members = [
    "crates/rusthole-core",
    "crates/rusthole-import",
    "crates/rusthole-dns",
    "crates/rusthole-store",
    "crates/rusthole-web",
    "crates/rusthole-tls",
    "crates/rusthole-lists",
    "crates/rusthole",
]
default-members = ["crates/rusthole"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/warchant/rusthole"
publish = false

[workspace.dependencies]
# Our crates. Add each one here when another crate first uses it.
rusthole-core = { path = "crates/rusthole-core" }
rusthole-import = { path = "crates/rusthole-import" }
rusthole-dns = { path = "crates/rusthole-dns" }
rusthole-tls = { path = "crates/rusthole-tls" }
rusthole-store = { path = "crates/rusthole-store" }
rusthole-lists = { path = "crates/rusthole-lists" }
rusthole-web = { path = "crates/rusthole-web" }

# Third-party crates. Add new ones here, then use `x = { workspace = true }` in a member.
anyhow = "1"
# Lock-free swap of the current TLS certificate (no lock, so no wait without a time limit).
arc-swap = "1.9"
# CSPRNG for DNS query IDs and source ports.
getrandom = "0.4"
# DNS wire format only (decision D11). Default features: no DNSSEC crypto, no aws-lc.
hickory-proto = "0.26.3"
# Local interface addresses for the "auto" listeners and the client ACL.
if-addrs = "0.15"
# Bounded LRU maps (cache, rate limiter). Pure: no I/O.
lru = "0.19"
# Public Suffix List with the list bundled in the code: registrable domain (eTLD+1) for the
# statistics. Pure Rust, no I/O.
psl = "2.1"
# Locks with a time limit (`try_lock_for`).
parking_lot = "0.13"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
clap = { version = "4", features = ["derive", "env"] }
idna = "1.1"
# HTTP client for list downloads (part P3b). No default features: no aws-lc, no system
# proxy, no HTTP/2. TLS comes from rusthole-tls (rustls with ring, amendment A1).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "deflate"] }
# Metadata files of the list disk cache (part P3b).
serde_json = "1.0.154"
# Pure-Rust deflate only. The default features pull in C and crypto crates.
zip = { version = "9.6", default-features = false, features = ["deflate"] }
regex = "1.13"
# TLS (amendment A1): the crypto provider is `ring`. The default features pull in aws-lc,
# so each TLS crate turns them off.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.16", features = ["std"] }
time = { version = "0.3.47", features = ["formatting"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
# `bundled` builds SQLite from source, so the static musl build needs no system library.
# `serialize` lets the import read a database from memory, with no temp file.
# `limits` and `hooks` let the import cap value sizes and VM steps for an untrusted file.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "serialize", "limits", "hooks"] }
serde = { version = "1", features = ["derive"] }
# Keyed SipHash-1-3 for the compiled domain set of the policy engine (a seed for each engine).
siphasher = { version = "1.0.4", default-features = false }
tempfile = "3.27"
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Admin API (part P5). axum on hyper 1; hyper-util serves HTTP/1.1 and HTTP/2 on one port.
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path"] }
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "tokio", "service"] }
http = "1.5"
http-body-util = "0.1.5"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["limit", "timeout"] }
# Embeds web/dist (or the placeholder page) into the binary. `debug-embed` embeds in debug
# builds too, so tests see the same files as a release build.
rust-embed = { version = "8.14", features = ["debug-embed", "interpolate-folder-path"] }
# Argon2id password hashes (decision D10). Pure Rust.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# Constant-time compare of the CSRF token and token hashes.
subtle = "2.6.1"
# Reads the password from the terminal without echo (`rusthole passwd`).
rpassword = "7.5.5"
# Edits rusthole.toml and keeps comments and order (decision D2).
toml_edit = "0.25.19"
# MIME types of the embedded UI files.
mime_guess = "2.0.5"
# base64url for session ids, CSRF tokens and API tokens.
base64 = "0.23.1"

# Dev
# Makes gzip test bodies in the list refresher tests (tests only).
flate2 = "1.1.11"
# Counts heap bytes in the memory test of the policy engine (tests only).
peak_alloc = "0.3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort): a panic in one task must not stop DNS for everyone.
panic = "unwind"

# Dev and test builds: line tables only for our crates (backtraces keep file and line),
# no debug info for dependencies. Builds are faster and use less disk. Owner decision:
# do not remove. The test profile inherits these settings from dev.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
