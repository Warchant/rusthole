[package]
name = "rusthole"
description = "DNS ad blocker for home and small office networks. One static binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rusthole"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rusthole-core = { workspace = true }
rusthole-import = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rusthole-import = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
