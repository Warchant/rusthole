[package]
name = "rusthole-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rusthole-core = { path = "../crates/rusthole-core" }
rusthole-import = { path = "../crates/rusthole-import" }
rusthole-dns = { path = "../crates/rusthole-dns" }
rusthole-tls = { path = "../crates/rusthole-tls" }
rusthole-web = { path = "../crates/rusthole-web" }
rustls-pki-types = "1.16"

# Not a member of the main workspace: it needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "domain_parse"
path = "fuzz_targets/domain_parse.rs"
test = false
doc = false
bench = false

