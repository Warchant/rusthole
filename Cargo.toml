[workspace]
resolver = "3"
members = [
    "crates/rusthole-core",
    "crates/rusthole-import",
    "crates/rusthole-dns",
    "crates/rusthole-store",
    "crates/rusthole-web",
    "crates/rusthole",
]
default-members = ["crates/rusthole"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/warchant/rusthole"
publish = false

[workspace.dependencies]
# Our crates. Add each one here when another crate first uses it.

# Third-party crates. Add new ones here, then use `x = { workspace = true }` in a member.
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Dev
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort): a panic in one task must not stop DNS for everyone.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
