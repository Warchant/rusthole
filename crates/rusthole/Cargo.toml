[package]
name = "rusthole"
description = "DNS ad blocker for home and small office networks. One static binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rusthole"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
rpassword = { workspace = true }
rusthole-core = { workspace = true }
rusthole-dns = { workspace = true }
rusthole-import = { workspace = true }
rusthole-lists = { workspace = true }
rusthole-store = { workspace = true }
rusthole-tls = { workspace = true }
rustls = { workspace = true }
rusthole-web = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
hickory-proto = { workspace = true }
rusthole-import = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
